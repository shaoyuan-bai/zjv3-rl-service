    RAR_KNEE_JOINT: 0.0
    RAR_FOOT_JOINT: 0.0
    RBL_ABAD_JOINT: 0.0
    RBL_HIP_JOINT: 0.0
    RBL_KNEE_JOINT: 0.0
    RBL_FOOT_JOINT: 0.0
  sign:
